[package]
name = "appsdesktop"
version = "1.0.5"
edition = "2021"
default-run = "appsdesktop"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[[bin]]
name = "generate_keys"
path = "generate_keys.rs"

[[bin]]
name = "appsdesktop"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
dotenvy = "0.15"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
# SQLCipher is bundled for desktop builds; existing plaintext files are migrated
# once, after the user establishes a portable recovery phrase.
rusqlite = { version = "0.31", features = ["bundled-sqlcipher-vendored-openssl"] }
argon2 = { version = "0.5", features = ["rand"] }
rand = "0.8"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
zeroize = "1"
printpdf = "0.7"
dirs = "5"
image = { version = "0.25", default-features = true }
open = "5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["fs", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
