[package]
name = "appsdesktop"
version = "1.0.0"
edition = "2021"
default-run = "appsdesktop"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[[bin]]
name = "generate_keys"
path = "generate_keys.rs"

[[bin]]
name = "appsdesktop"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
dotenvy = "0.15"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
# NOTA P0-06: La feature "sqlcipher" requiere sqlcipher.lib del sistema (no compila).
# "bundled-sqlcipher" requiere OpenSSL. Para la versión desktop local se usa SQLite
# estándar "bundled" (PRAGMA key se ignora). Para cifrado real en producción:
#   - Windows: instalar SQLCipher y usar features = ["bundled", "sqlcipher"]
#   - O usar features = ["bundled-sqlcipher"] con OpenSSL disponible
rusqlite = { version = "0.31", features = ["bundled"] }
argon2 = { version = "0.5", features = ["rand"] }
rand = "0.8"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
printpdf = "0.7"
dirs = "5"
image = { version = "0.25", default-features = true }
open = "5"
