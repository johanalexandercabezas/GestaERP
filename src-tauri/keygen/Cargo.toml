[package]
name = "gestaerp-keygen"
version = "2.0.0"
edition = "2021"
description = "Keygen profesional para GestaERP - GestaSoftTech Colombia"

[[bin]]
name = "gestaerp-keygen"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
dirs = "5"